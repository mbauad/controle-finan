<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinControl - Transações</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div style="font-size: 22px; font-weight: 700; margin-bottom: 24px;">💰 FinControl</div>
            <nav>
                <a href="/">📊 Dashboard</a>
                <a href="/transactions" class="active">💳 Transações</a>
                <a href="/report">📋 Relatório</a>
            </nav>
        </aside>

        <main class="main">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                <div>
                    <h1>💳 Gerenciar Transações</h1>
                    <p style="color: var(--muted);">Cadastre, edite e delete suas transações</p>
                </div>
                <button class="btn primary" onclick="openModal()">➕ Nova Transação</button>
            </header>

            <div style="background: var(--card); border-radius: 12px; padding: 24px;">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Tipo</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="txList">
                        <tr><td colspan="6" style="text-align: center; padding: 32px;">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom: 24px;">➕ Nova Transação</h3>
            <form id="txForm" onsubmit="saveTransaction(event)">
                <div class="form-group">
                    <label>Tipo *</label>
                    <select id="type" class="input" required>
                        <option value="income">📈 Receita</option>
                        <option value="expense">📉 Despesa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Descrição *</label>
                    <div class="field-with-actions">
                        <input type="text" id="desc" class="input" placeholder="Ex: Venda de produto" required list="descList" autocomplete="off">
                        <datalist id="descList"></datalist>
                        <button type="button" class="btn-action" onclick="addNewDesc()">➕</button>
                        <button type="button" class="btn-action" onclick="editDesc()">✏️</button>
                        <button type="button" class="btn-action" onclick="deleteDesc()">🗑️</button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Valor (R$) *</label>
                        <input type="number" id="val" class="input" step="0.01" min="0" placeholder="0,00" required>
                    </div>
                    <div class="form-group">
                        <label>Data *</label>
                        <input type="date" id="date" class="input" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Categoria *</label>
                    <div class="field-with-actions">
                        <input type="text" id="cat" class="input" placeholder="Ex: Vendas, Alimentação" required list="catList" autocomplete="off">
                        <datalist id="catList"></datalist>
                        <button type="button" class="btn-action" onclick="addNewCat()">➕</button>
                        <button type="button" class="btn-action" onclick="editCat()">✏️</button>
                        <button type="button" class="btn-action" onclick="deleteCat()">🗑️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Notas</label>
                    <textarea id="notes" class="input" placeholder="Observações adicionais (opcional)"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn primary" id="submitBtn">💾 Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
